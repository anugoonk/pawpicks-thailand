# Firebase App Hosting — build & runtime configuration
# Docs: https://firebase.google.com/docs/app-hosting/configure
#
# This file is COMMITTED and must never contain secret values. Secrets are
# stored in Cloud Secret Manager and referenced by name below. Create them with:
#
#   firebase apphosting:secrets:set SUPABASE_SERVICE_ROLE_KEY
#   firebase apphosting:secrets:set STRIPE_SECRET_KEY
#   firebase apphosting:secrets:set STRIPE_WEBHOOK_SECRET
#
# then grant the backend access when prompted (or:
#   firebase apphosting:secrets:grantaccess <SECRET> --backend <backend-id>)
#
# Region: choose the App Hosting region closest to Thailand at backend
# creation time (in the Firebase console). At time of writing the nearest
# supported region is `asia-east1` (Taiwan). Region cannot be changed later.

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  # ---- Public (safe for the browser). Non-secret values. --------------------
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://pawpicks-thailand.web.app # replace with the custom domain once connected
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SUPABASE_URL
    value: https://YOUR-PROD-PROJECT.supabase.co
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SUPABASE_ANON_KEY
    # The anon key is not a secret (RLS-protected) but is environment-specific.
    # Store it as a secret anyway to keep it out of git, or inline the prod value here.
    secret: NEXT_PUBLIC_SUPABASE_ANON_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    secret: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    availability:
      - BUILD
      - RUNTIME

  # ---- Server-only secrets. NEVER exposed to the client. -------------------
  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: SUPABASE_SERVICE_ROLE_KEY
    availability:
      - RUNTIME

  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - RUNTIME

  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
    availability:
      - RUNTIME

  # ---- Server-only, non-secret config ------------------------------------
  - variable: ADMIN_EMAIL
    value: owner@example.com
    availability:
      - RUNTIME

  - variable: SHIPPING_FLAT_RATE
    value: "50"
    availability:
      - RUNTIME

  - variable: FREE_SHIPPING_THRESHOLD
    value: "1500"
    availability:
      - RUNTIME

  # Optional: uncomment (and create the secret) to let the post-deploy smoke
  # test read /api/health?token=... — otherwise /api/health returns status only.
  #   firebase apphosting:secrets:set HEALTH_CHECK_TOKEN
  # - variable: HEALTH_CHECK_TOKEN
  #   secret: HEALTH_CHECK_TOKEN
  #   availability:
  #     - RUNTIME
