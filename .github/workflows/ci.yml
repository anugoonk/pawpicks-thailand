name: CI

# Runs on every PR and on pushes to develop. This workflow NEVER deploys —
# Firebase App Hosting deploys production from `main` automatically after merge.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard against committed secrets
        run: |
          set -euo pipefail
          # Any tracked .env* file other than .env.example fails the build.
          leaked="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)"
          if [ -n "$leaked" ]; then
            echo "::error::Tracked env file(s) found:"; echo "$leaked"
            exit 1
          fi
          # Obvious live-key patterns anywhere in tracked files.
          if git grep -nE 'sk_live_[0-9A-Za-z]{16,}|service_role.*eyJ' -- . ':!*.md' ':!.github/**'; then
            echo "::error::Possible live secret committed."
            exit 1
          fi
          echo "No committed secrets detected."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test
        env:
          # Tests must not need production secrets. Provide inert values only.
          NEXT_PUBLIC_SITE_URL: http://localhost:3021

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3021

      - name: Dependency audit (high severity)
        run: npm audit --omit=dev --audit-level=high
