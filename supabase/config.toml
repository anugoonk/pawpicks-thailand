# Supabase CLI configuration.
# Docs: https://supabase.com/docs/guides/cli/config
# `project_id` is a LOCAL identifier only — it is not a secret. The real
# project ref is set with `supabase link --project-ref <ref>` and lives in
# supabase/.temp (git-ignored).

project_id = "pawpicks-thailand"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

# Public bucket for product images. Uploads are admin-only (see RLS in
# supabase/migrations); anyone may read.
[storage.buckets.product-images]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/avif"]

[auth]
enabled = true
# Set to the deployed site URL per environment via the dashboard / CLI.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[analytics]
enabled = false
